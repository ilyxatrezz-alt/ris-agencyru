      /* Preloader critical styles */
      .preloader-fallback{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#09090b}

  <body>
    <div id="root">
      <!-- Fallback preloader for slow connections -->
      <div class="preloader-fallback" id="fallback-preloader">
        <span>РИС</span>
      </div>
    </div>
    <script>
      // Remove fallback preloader once React loads
      window.addEventListener('DOMContentLoaded', function() {
        var fp = document.getElementById('fallback-preloader');
        if (fp) setTimeout(function() { fp.style.display = 'none'; }, 100);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
